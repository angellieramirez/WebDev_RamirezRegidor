<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Page</title>
    <style>
        body {
            background-color: black; 
            font-family: "Times New Roman", Times, serif; 
            margin: 20px;
            color: white;
        }
        h1 {
            color: red;
            text-align: center;
        }
        p {
            color: #ddd;
            text-align: center;
        }
        a {
            display: inline-block;
            margin: 15px 0;
            color: white;
            background: red;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background: darkred;
        }
        img {
            display: block;
            margin: 20px auto;
            border-radius: 8px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 300px;
            background: white;
            color: black;
            font-family: "Times New Roman", Times, serif; 
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #ffcccc;
        }
        h2 {
            text-align: center;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Welcome to My YouTube Page</h1>
    <p>Create and upload a video here.</p>

    <img src="youtube.png" alt="YouTube img" width="150">

        <a href="https://www.youtube.com" target="_blank">Go to YouTube</a>
    </div>
